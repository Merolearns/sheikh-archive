<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#151236"/>
    <stop offset=".28" stop-color="#2b2156"/>
    <stop offset=".5" stop-color="#5a2f62"/>
    <stop offset=".66" stop-color="#9a4458"/>
    <stop offset=".78" stop-color="#d0703f"/>
    <stop offset=".9" stop-color="#eda04a"/>
    <stop offset="1" stop-color="#f6c46e"/>
  </linearGradient>
  <radialGradient id="sun" cx="800" cy="760" r="420" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffe3a3" stop-opacity=".95"/>
    <stop offset=".22" stop-color="#ffcf7a" stop-opacity=".55"/>
    <stop offset="1" stop-color="#f6a44c" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f6c46e" stop-opacity="0"/>
    <stop offset="1" stop-color="#f6c46e" stop-opacity=".35"/>
  </linearGradient>
  <!-- minaret: base at 0,0, grows upward -->
  <g id="minaret">
    <path d="M-13,0 V-170 H-19 V-180 H19 V-170 H13 V0 Z"/>
    <path d="M-10,-180 V-250 H-15 V-258 H15 V-250 H10 V-180 Z"/>
    <path d="M-8,-258 V-280 C-8,-292 -3,-300 0,-318 C3,-300 8,-292 8,-280 V-258 Z"/>
    <rect x="-1.2" y="-334" width="2.4" height="18"/>
    <circle cx="0" cy="-336" r="3.4"/>
  </g>
  <g id="dome">
    <path d="M-100,0 V-30 C-100,-78 -48,-96 0,-118 C48,-96 100,-78 100,-30 V0 Z"/>
    <rect x="-2" y="-140" width="4" height="24"/>
    <circle cx="0" cy="-143" r="5"/>
  </g>
  <g id="palm">
    <path d="M-4,0 C-2,-60 4,-120 14,-168 L19,-167 C10,-120 5,-60 5,0 Z"/>
    <path d="M16,-168 C-10,-180 -40,-176 -66,-150 C-38,-166 -12,-168 14,-163 Z"/>
    <path d="M16,-168 C-4,-196 -30,-204 -54,-200 C-28,-192 -6,-182 14,-166 Z"/>
    <path d="M17,-169 C26,-200 46,-214 72,-212 C48,-202 32,-188 20,-166 Z"/>
    <path d="M18,-167 C44,-176 70,-166 84,-138 C64,-156 42,-162 19,-162 Z"/>
    <path d="M16,-168 C14,-196 2,-218 -14,-228 C-2,-210 6,-190 12,-166 Z"/>
    <path d="M18,-166 C30,-150 34,-126 30,-104 C26,-126 20,-146 15,-163 Z"/>
  </g>
  <g id="star8">
    <rect x="-15" y="-15" width="30" height="30"/>
    <rect x="-15" y="-15" width="30" height="30" transform="rotate(45)"/>
    <circle r="6"/>
  </g>
</defs>

<rect width="1600" height="1000" fill="url(#sky)"/>
<rect width="1600" height="1000" fill="url(#sun)"/>
<circle cx="800" cy="782" r="86" fill="#ffe2a0" opacity=".92"/>

<!-- a few early stars high in the sky -->
<g fill="#fff4d6" opacity=".7">
  <circle cx="212" cy="96" r="1.6"/><circle cx="388" cy="168" r="1.2"/><circle cx="1290" cy="120" r="1.7"/>
  <circle cx="1440" cy="230" r="1.1"/><circle cx="980" cy="70" r="1.3"/><circle cx="120" cy="300" r="1"/>
  <circle cx="640" cy="122" r="1"/><circle cx="1520" cy="88" r="1.2"/>
</g>

<!-- far skyline (low contrast, gives depth) -->
<g fill="#6b3a5e" opacity=".75">
  <path d="M0,840 V800 H70 V780 C70,752 96,742 112,730 C128,742 154,752 154,780 V800 H240 V840 Z"/>
  <use href="#minaret" transform="translate(260 840) scale(.55)"/>
  <path d="M300,840 V812 H360 C362,790 380,780 392,772 C404,780 422,790 424,812 H470 V840 Z"/>
  <path d="M1120,840 V806 H1180 C1182,782 1204,770 1220,760 C1236,770 1258,782 1260,806 H1330 V840 Z"/>
  <use href="#minaret" transform="translate(1360 840) scale(.6)"/>
  <path d="M1380,840 V800 H1460 C1462,776 1486,764 1504,754 C1522,764 1546,776 1548,800 H1600 V840 Z"/>
</g>
<rect y="760" width="1600" height="120" fill="url(#haze)"/>

<!-- main mosque silhouette -->
<g fill="#24183a">
  <rect x="560" y="800" width="480" height="80"/>
  <use href="#dome" transform="translate(800 760) scale(1.2)"/>
  <rect x="660" y="760" width="280" height="44"/>
  <use href="#dome" transform="translate(660 804) scale(.5)"/>
  <use href="#dome" transform="translate(940 804) scale(.5)"/>
  <use href="#minaret" transform="translate(520 880) scale(1.12)"/>
  <use href="#minaret" transform="translate(1080 880) scale(1.12)"/>
</g>
<!-- warm lit arches -->
<g fill="#f2a64c" opacity=".38">
  <path d="M614,872 V846 a14,14 0 0 1 28,0 V872 Z"/><path d="M686,872 V846 a14,14 0 0 1 28,0 V872 Z"/>
  <path d="M780,872 V836 a20,20 0 0 1 40,0 V872 Z"/>
  <path d="M886,872 V846 a14,14 0 0 1 28,0 V872 Z"/><path d="M958,872 V846 a14,14 0 0 1 28,0 V872 Z"/>
</g>

<!-- palms and ground -->
<g fill="#1a1230">
  <use href="#palm" transform="translate(230 905) scale(1.25)"/>
  <use href="#palm" transform="translate(330 905) scale(-.85 .85)"/>
  <use href="#palm" transform="translate(1300 905) scale(-1.2 1.2)"/>
  <use href="#palm" transform="translate(1400 905) scale(.8)"/>
  <path d="M0,1000 V900 C300,878 520,884 800,880 C1080,884 1300,878 1600,900 V1000 Z"/>
</g>

<!-- gold double-rule frame with 8-point star corners -->
<g fill="none" stroke="#c9a227">
  <rect x="26" y="26" width="1548" height="948" stroke-width="2.5" opacity=".75"/>
  <rect x="38" y="38" width="1524" height="924" stroke-width="1" opacity=".5"/>
  <g stroke-width="1.6" opacity=".85">
    <use href="#star8" transform="translate(26 26) scale(1)"/>
    <use href="#star8" transform="translate(1574 26) scale(1)"/>
    <use href="#star8" transform="translate(26 974) scale(1)"/>
    <use href="#star8" transform="translate(1574 974) scale(1)"/>
  </g>
</g>
</svg>
