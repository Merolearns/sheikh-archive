<section class="view" id="view-playlist">
  <div class="wrap">
    <div id="pl-head"></div>
    <ul id="pl-list" class="pl-list"></ul>
  </div>
</section>

<section class="view" id="view-lesson">
  <div class="wrap">
    <div class="ls-layout">
      <div class="ls-main">
        <div id="ls-error"></div>
        <video id="ls-player" class="ls-player" controls preload="metadata" playsinline></video>
        <div id="ls-info"></div>
        <div id="ls-actions" class="ls-actions"></div>
        <div id="ls-panel" class="ls-panel" hidden></div>
      </div>
      <aside id="ls-next"></aside>
    </div>
  </div>
</section>
