<section class="view" id="view-home">
  <div class="hm-hero">
    <div class="hm-watermark" aria-hidden="true">بسم الله</div>
    <div class="hm-hero-inner">
      <h1 class="hm-welcome" id="hm-welcome"></h1>
      <div class="hm-search">
        <input id="hm-search-input" type="search" autocomplete="off" />
        <button id="hm-search-btn" type="button"></button>
        <div class="hm-results" id="hm-search-results" hidden></div>
      </div>
      <div class="hm-hero-actions">
        <button class="hm-btn hm-btn-primary" id="hm-btn-browse" type="button"></button>
        <button class="hm-btn hm-btn-ghost" id="hm-btn-continue" type="button"></button>
      </div>
    </div>
  </div>

  <section class="hm-rail-sec" id="hm-sec-continue">
    <h2 class="hm-rail-title" id="hm-title-continue"></h2>
    <div class="hm-rail" id="hm-rail-continue"></div>
  </section>

  <section class="hm-rail-sec">
    <h2 class="hm-rail-title" id="hm-title-featured"></h2>
    <div class="hm-rail" id="hm-rail-featured"></div>
  </section>

  <section class="hm-rail-sec">
    <h2 class="hm-rail-title" id="hm-title-scholars"></h2>
    <div id="hm-scholar-card"></div>
  </section>
</section>

<section class="view" id="view-library">
  <div class="lb-wrap">
    <h1 class="lb-title" id="lb-title"></h1>
    <div class="lb-layout">
      <aside class="lb-side" aria-label="topics">
        <ul class="lb-side-list" id="lb-side-list"></ul>
      </aside>
      <div class="lb-main">
        <div class="lb-toolbar">
          <input id="lb-search" type="search" autocomplete="off" />
          <div class="lb-sort-wrap">
            <label id="lb-sort-label" for="lb-sort"></label>
            <select id="lb-sort"></select>
          </div>
        </div>
        <div class="lb-grid" id="lb-grid"></div>
        <p class="lb-empty" id="lb-empty" hidden></p>
      </div>
    </div>
  </div>
</section>
