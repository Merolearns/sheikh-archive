/* ============ DESIGN TOKENS ============ */
:root{
  --font-verse:'Amiri Quran','Amiri',serif;
  --font-head:'Amiri','Noto Sans Arabic',serif;
  --font-ar:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --font-kufi:'Reem Kufi','Noto Sans Arabic',sans-serif;
  --font-lat:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --gold:#C9A227; --gold-2:#E3C566;
  --r:14px; --r-s:9px;
  --shadow:0 10px 30px rgba(0,0,0,.28);
  --ease:cubic-bezier(.22,.8,.28,1);
}
[data-theme="emerald"]{
  --bg:#0A2A20; --bg2:#0E3527; --bg3:#123C2D; --bg4:#164231;
  --ink:#F6F0DF; --ink2:#CFC39F; --ink3:#93A892;
  --line:rgba(201,162,39,.30); --line-soft:rgba(246,240,223,.10);
  --brand:#1E7A52; --brand-ink:#FFF9E8; --brand-deep:#0B3D2E;
  --gold:#C9A227; --gold-2:#E9CE7A;
  --card-shadow:0 12px 34px rgba(0,0,0,.40);
  --pattern-op:.07; --hero-veil:rgba(6,26,19,.42);
}
[data-theme="parchment"]{
  --bg:#F7F3EA; --bg2:#FFFFFF; --bg3:#EFE7D2; --bg4:#E7DCC0;

  --pattern-op:.06; --hero-veil:rgba(30,40,30,.30);
}

  --ink:#EDF1F7; --ink2:#B7C3D6; --ink3:#7F8DA3;
  --line:rgba(201,162,39,.28); --line-soft:rgba(237,241,247,.10);
  --brand:#1D4E89; --brand-ink:#F2F6FC; --brand-deep:#0A1628;
  --gold:#C9A227; --gold-2:#E9CE7A;

}

}

/* ============ BASE ============ */
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ar);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
[lang="en"] body, body.en{font-family:var(--font-lat)}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.6;margin:0 0 .5em}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
img{display:block;max-width:100%}
::selection{background:var(--gold);color:#111}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.view{display:none;animation:viewIn .45s var(--ease)}
.view.on{display:block}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px}
.kufi{font-family:var(--font-kufi)}
.gold{color:var(--gold-2)}
.rule{height:1px;background:linear-gradient(to left,transparent,var(--gold),transparent);border:0;margin:26px auto;max-width:520px;opacity:.7}
